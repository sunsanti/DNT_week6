<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Study Room Booking</title>
    <meta name="description" content="Book campus study rooms and labs: pick a time slot, choose your seats." />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Study Rooms" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Relative URLs so everything works under a sub-path such as /DNT_week6/ on GitHub Pages. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f172a;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
